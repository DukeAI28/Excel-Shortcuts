<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Excel Shortcuts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F7F8FC;
    --surface: #FFFFFF;
    --border: #E4E7EF;
    --border-light: #F0F2F8;
    --text: #0D1117;
    --text2: #5E6A8A;
    --text3: #9AA0BC;
    --blue: #2F7EFF;
    --blue-bg: #EBF2FF;
    --key-bg: #F0F2F8;
    --key-border: #D0D5E8;
    --tip-bg: #FFFBEB;
    --tip-border: #F59E0B;
    --tip-text: #78400C;
    --star: #F59E0B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1021;
      --surface: #181B2E;
      --border: #2A2D45;
      --border-light: #232640;
      --text: #EDF0FF;
      --text2: #8A93B8;
      --text3: #5B617A;
      --key-bg: #252843;
      --key-border: #363A5A;
      --tip-bg: #2A2010;
      --tip-border: #B97A0A;
      --tip-text: #F0C070;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
  }
  .topbar-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .app-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .app-sub   { font-size: 11px; color: var(--text3); margin-top: 1px; }

  /* Platform toggle */
  .platform-toggle {
    display: flex;
    background: var(--border-light);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .platform-toggle button {
    border: none;
    background: none;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    font-family: inherit;
    transition: all .15s;
  }
  .platform-toggle button.active {
    background: var(--surface);
    color: var(--blue);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }

  /* Search */
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text3);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--blue); }
  .search-input::placeholder { color: var(--text3); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text3);
    font-family: inherit;
    border-bottom: 2px solid transparent;
    transition: all .15s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--blue);
    border-bottom-color: var(--blue);
  }

  /* ── Main content ── */
  .content { padding: 16px; max-width: 640px; margin: 0 auto; }

  /* Section labels */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text3);
    margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Collapsible section header */
  .section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin: 0 0 10px;
  }
  .section-toggle .section-label { margin: 0; }
  .section-toggle-chevron {
    font-size: 13px;
    color: var(--text3);
    transition: transform .2s;
  }
  .section-toggle-chevron.open { transform: rotate(180deg); }
  .collapsible { overflow: hidden; }
  .collapsible.collapsed { display: none; }

  /* ── Shortcut card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { box-shadow: 0 0 0 2px var(--blue); }
  .card-row { display: flex; align-items: flex-start; gap: 8px; }
  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-desc {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
    line-height: 1.35;
  }
  .key-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
  }
  .key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 500;
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-bottom: 2px solid var(--key-border);
    border-radius: 5px;
    padding: 2px 7px;
    color: var(--text);
  }
  .plus {
    font-size: 11px;
    color: var(--text3);
    font-weight: 600;
  }
  .menu-row {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    margin-top: 7px;
  }
  .menu-pin { font-size: 10px; flex-shrink: 0; margin-top: 1px; }
  .menu-path {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.45;
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .fav-btn {
    border: none;
    background: none;
    cursor: pointer;
    padding: 2px;
    font-size: 16px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .chevron {
    font-size: 14px;
    color: var(--text3);
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform .2s;
  }
  .chevron.open { transform: rotate(180deg); }
  .tip-box {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    background: var(--tip-bg);
    border-left: 3px solid var(--tip-border);
    border-radius: 6px;
    padding: 9px 10px;
    margin-top: 10px;
  }
  .tip-icon { font-size: 13px; flex-shrink: 0; }
  .tip-text { font-size: 12.5px; color: var(--tip-text); line-height: 1.5; }

  /* ── Category grid ── */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .15s;
  }
  .cat-card:active { box-shadow: 0 0 0 2px var(--blue); }
  .cat-icon-wrap {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .cat-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .cat-count { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }

  /* ── Results label ── */
  .results-label {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* Back button for category view */
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-row1">
    <div>
      <div class="app-title" id="topTitle">Excel Shortcuts</div>
      <div class="app-sub">For college students</div>
    </div>
    <div class="platform-toggle">
      <button id="btnWin" class="active" onclick="setPlatform('win')">Windows</button>
      <button id="btnMac" onclick="setPlatform('mac')">Mac</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="search" placeholder="Search shortcuts…" oninput="onSearch(this.value)">
  </div>
</div>

<!-- Tabs -->
<div class="tabs" id="tabBar">
  <button class="tab-btn active" onclick="showTab('explore')">Explore</button>
  <button class="tab-btn" onclick="showTab('all')">All Shortcuts</button>
  <button class="tab-btn" onclick="showTab('favorites')">⭐ Favorites</button>
</div>

<!-- Content -->
<div class="content" id="mainContent"></div>

const MOST_USED_IDS = ['edt-3','edt-5','edt-1','wb-1','fmt-1','frm-1','frm-2','frm-3','edt-7','edt-9','fmt-7','dat-1'];

// ── State ──
let platform = 'win';
let currentTab = 'explore';
let currentCat = null;
let favorites = new Set();
let expandedCards = new Set();
let mostUsedOpen = false;

function loadFavs() {
  try { const s = localStorage.getItem('xl_favs'); if (s) favorites = new Set(JSON.parse(s)); } catch(e){}
}
function saveFavs() {
  try { localStorage.setItem('xl_favs', JSON.stringify([...favorites])); } catch(e){}
}

// ── Platform ──
function setPlatform(p) {
  platform = p;
  document.getElementById('btnWin').classList.toggle('active', p === 'win');
  document.getElementById('btnMac').classList.toggle('active', p === 'mac');
  render();
}

// ── Search ──
function onSearch(val) {
  if (val.trim()) {
    renderSearch(val.trim());
  } else {
    render();
  }
}

// ── Tabs ──
function showTab(tab) {
  currentTab = tab;
  currentCat = null;
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['explore','all','favorites'][i] === tab);
  });
  render();
}

// ── Render ──
function render() {
  const el = document.getElementById('mainContent');
  if (currentTab === 'explore') {
    if (currentCat) {
      renderCategory(el);
    } else {
      renderExplore(el);
    }
  } else if (currentTab === 'all') {
    renderAll(el);
  } else {
    renderFavorites(el);
  }
}

function renderSearch(q) {
  const el = document.getElementById('mainContent');
  const ql = q.toLowerCase();
  const results = SHORTCUTS.filter(s =>
    s.desc.toLowerCase().includes(ql) ||
    s.win.toLowerCase().includes(ql) ||
    s.mac.toLowerCase().includes(ql) ||
    s.cat.includes(ql)
  );
  let html = `<p class="results-label">${results.length} result${results.length!==1?'s':''} for "${q}"</p>`;
  if (results.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No shortcuts found</div><div class="empty-sub">Try different keywords</div></div>`;
  } else {
    html += results.map(s => cardHTML(s, true)).join('');
  }
  el.innerHTML = html;
}

function toggleMostUsed() {
  mostUsedOpen = !mostUsedOpen;
  render();
}

function renderExplore(el) {
  const mostUsed = MOST_USED_IDS.map(id => SHORTCUTS.find(s => s.id === id)).filter(Boolean);
  const topPicks = SHORTCUTS.filter(s => s.tip).slice(0, 5);

  let html = `<div class="section-toggle" onclick="toggleMostUsed()">
    <span class="section-label">Most Used (${mostUsed.length})</span>
    <span class="section-toggle-chevron${mostUsedOpen?' open':''}">▼</span>
  </div>
  <div class="collapsible${mostUsedOpen?'':' collapsed'}">`;
  html += mostUsed.map(s => cardHTML(s, true)).join('');
  html += `</div>`;

  html += `<div class="section-label" style="margin-top:20px">Browse by Category</div>`;
  html += `<div class="cat-grid">`;
  CATEGORIES.forEach(cat => {
    const count = SHORTCUTS.filter(s => s.cat === cat.id).length;
    html += `<div class="cat-card" onclick="openCat('${cat.id}')">
      <div class="cat-icon-wrap" style="background:${cat.bg}">${cat.icon}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-count">${count} shortcuts</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-label" style="margin-top:20px">Top Picks for Students</div>`;
  html += topPicks.map(s => cardHTML(s, true)).join('');

  el.innerHTML = html;
}

function openCat(catId) {
  currentCat = catId;
  document.getElementById('searchInput').value = '';
  const el = document.getElementById('mainContent');
  renderCategory(el);
}

function renderCategory(el) {
  const cat = CATEGORIES.find(c => c.id === currentCat);
  const shortcuts = SHORTCUTS.filter(s => s.cat === currentCat);
  let html = `<button class="back-btn" onclick="backToExplore()">← Back</button>`;
  html += `<div class="section-label">${cat.icon} ${cat.label} — ${shortcuts.length} shortcuts</div>`;
  html += shortcuts.map(s => cardHTML(s, false)).join('');
  el.innerHTML = html;
}

function backToExplore() {
  currentCat = null;
  render();
}

function renderAll(el) {
  let html = `<div class="section-label">${SHORTCUTS.length} shortcuts</div>`;
  html += SHORTCUTS.map(s => cardHTML(s, true)).join('');
  el.innerHTML = html;
}

function renderFavorites(el) {
  const favs = SHORTCUTS.filter(s => favorites.has(s.id));
  if (favs.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">⭐</div>
      <div class="empty-title">No favorites yet</div>
      <div class="empty-sub">Tap ☆ on any shortcut to save it here</div>
    </div>`;
  } else {
    let html = `<div class="section-label">${favs.length} saved shortcut${favs.length!==1?'s':''}</div>`;
    html += favs.map(s => cardHTML(s, true)).join('');
    el.innerHTML = html;
  }
}

function cardHTML(s, showCat) {
  const cat = CATEGORIES.find(c => c.id === s.cat);
  const combo = platform === 'mac' ? s.mac : s.win;
  const menu = MENUS[s.id] || '';
  const isFav = favorites.has(s.id);
  const isExp = expandedCards.has(s.id);

  const keys = combo.split('+').map(k => k.trim());
  const keyHtml = keys.map((k,i) => (i>0?'<span class="plus">+</span>':'')+`<span class="key">${k}</span>`).join('');

  const menuHtml = menu ? `<div class="menu-row"><span class="menu-pin">📍</span><span class="menu-path">${menu}</span></div>` : '';
  const tipHtml = s.tip && isExp ? `<div class="tip-box"><span class="tip-icon">💡</span><span class="tip-text">${s.tip}</span></div>` : '';
  const chevron = s.tip ? `<span class="chevron${isExp?' open':''}">▼</span>` : '';
  const catDot = showCat && cat ? `<span class="cat-dot" style="background:${cat.color}"></span>` : '';

  return `<div class="card" id="card-${s.id}" onclick="toggleCard('${s.id}')">
    <div class="card-row">
      ${catDot}
      <div class="card-body">
        <div class="card-desc">${s.desc}</div>
        <div class="key-row">${keyHtml}</div>
        ${menuHtml}
        <div class="card-actions">
          <button class="fav-btn" onclick="toggleFav(event,'${s.id}')">${isFav?'⭐':'☆'}</button>
        </div>
      </div>
      ${chevron}
    </div>
    ${tipHtml}
  </div>`;
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id); else expandedCards.add(id);
  render();
  // Restore scroll position
}

function toggleFav(e, id) {
  e.stopPropagation();
  if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
  saveFavs();
  render();
}

// ── Init ──
loadFavs();
render();
</script>
</body>
</html>
